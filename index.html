<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neural Chess</title>
  <style>
    :root {
      --bg-primary: #141311;
      --bg-surface: #1E1D1A;
      --bg-surface-elevated: #26241F;
      --accent: #D8B45A;
      --accent-hover: #E8C87C;
      --accent-glow: rgba(216, 180, 90, 0.24);
      --text-main: #F4EFE4;
      --text-muted: #A9A296;
      --border-color: rgba(244, 239, 228, 0.12);
      --board-light: #EFE5D2;
      --board-dark: #8C7355;
      --highlight-select: rgba(216, 180, 90, 0.58);
      --highlight-last-move: rgba(216, 180, 90, 0.34);
      --highlight-target: rgba(143, 191, 106, 0.58);
      --danger: #E07A6A;
      --success: #8FBF6A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 75% 0%, rgba(216, 180, 90, 0.10) 0%, transparent 50%),
        linear-gradient(180deg, #191815 0%, #141311 55%, #0F0E0C 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(20, 19, 17, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #E8C87C, #B8923F);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #171410;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .logo-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo-subtitle {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 500;
    }

    .status-pill {
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 28px;
      padding: 24px;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
    }

    /* Left: Board Section */
    .board-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .player-banner {
      width: 520px;
      max-width: 90vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-avatar {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: var(--bg-surface-elevated);
      font-weight: 700;
    }

    .player-name {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .captured-pieces {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 16px;
      min-height: 20px;
    }

    .board-wrapper {
      position: relative;
      width: 520px;
      height: 520px;
      max-width: 90vw;
      max-height: 90vw;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      background: var(--board-dark);
    }

    .chessboard {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      height: 100%;
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0;
      cursor: pointer;
    }

    .square.light {
      background-color: var(--board-light);
    }

    .square.dark {
      background-color: var(--board-dark);
    }

    .square.selected {
      background-color: var(--highlight-select) !important;
    }

    .square.last-move {
      background-color: var(--highlight-last-move) !important;
    }

    .square.check {
      background-color: rgba(239, 68, 68, 0.7) !important;
    }

    .square.legal-target::after {
      content: '';
      position: absolute;
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.65);
      pointer-events: none;
    }

    .square.legal-capture::after {
      content: '';
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      border: 5px solid rgba(239, 68, 68, 0.75);
      background: transparent;
      pointer-events: none;
    }

    .coord-rank, .coord-file {
      position: absolute;
      font-size: 10px;
      font-weight: 700;
      pointer-events: none;
      opacity: 0.65;
    }

    .coord-rank {
      top: 3px;
      left: 4px;
    }

    .coord-file {
      bottom: 2px;
      right: 4px;
    }

    .square.light .coord-rank, .square.light .coord-file {
      color: var(--board-dark);
    }

    .square.dark .coord-rank, .square.dark .coord-file {
      color: var(--board-light);
    }

    .piece {
      width: 88%;
      height: 88%;
      cursor: grab;
      transition: transform 0.08s ease;
      pointer-events: auto;
    }

    .piece:active {
      cursor: grabbing;
      transform: scale(1.12);
    }

    /* Right: Control & Prediction Panel */
    .sidebar {
      width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.01em;
    }

    .card-title-icon {
      color: var(--accent);
    }

    /* Prediction List */
    .prediction-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .prediction-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 12px;
      background: var(--bg-surface-elevated);
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .prediction-item:hover {
      border-color: var(--accent);
      transform: translateX(2px);
    }

    .prediction-item.top-pick {
      border-color: rgba(216, 180, 90, 0.4);
      background: linear-gradient(90deg, rgba(216, 180, 90, 0.1) 0%, var(--bg-surface-elevated) 100%);
    }

    .pred-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pred-move {
      font-weight: 700;
      font-size: 1rem;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pred-rank {
      font-size: 0.75rem;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--bg-surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .prediction-item.top-pick .pred-rank {
      background: var(--accent);
      color: #171410;
      font-weight: 800;
    }

    .pred-prob {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent);
    }

    .progress-bar-bg {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #E8C87C, #B8923F);
      border-radius: 3px;
      transition: width 0.35s ease;
    }

    /* Move history */
    .history-box {
      max-height: 140px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      display: grid;
      grid-template-columns: 36px 1fr 1fr;
      row-gap: 6px;
      padding: 8px 4px;
    }

    .history-num {
      color: var(--text-muted);
    }

    .history-move {
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .history-move:hover {
      background: var(--bg-surface-elevated);
      color: var(--accent);
    }

    /* Controls */
    .btn-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--bg-surface-elevated);
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #171410;
      border-color: var(--accent);
      font-weight: 700;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-block {
      width: 100%;
      margin-top: 8px;
    }

    /* FEN Input Area */
    .fen-input-wrapper {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .fen-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #12110F;
      color: var(--text-main);
      font-family: monospace;
      font-size: 0.8rem;
    }

    .fen-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Promotion Modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 9, 8, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .promotion-dialog {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .promo-choice {
      width: 64px;
      height: 64px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }

    .promo-choice:hover {
      transform: scale(1.1);
      border-color: var(--accent);
    }

    .result-dialog {
      background: linear-gradient(160deg, #26241F, #1E1D1A);
      border: 1px solid rgba(216, 180, 90, 0.34);
      border-radius: 16px;
      padding: 26px 30px;
      text-align: center;
      min-width: 260px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    }

    .result-kicker {
      font-size: 0.66rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 800;
    }

    .result-title {
      font-size: 1.55rem;
      font-weight: 800;
      margin: 10px 0 4px 0;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .result-sub {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-bottom: 18px;
    }

    /* Arrow canvas overlay */
    #arrow-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    @media (max-width: 960px) {
      main {
        flex-direction: column;
        align-items: center;
      }
      .sidebar {
        width: 520px;
        max-width: 90vw;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <div class="logo-badge">♟</div>
      <div>
        <div class="logo-title">NEURAL CHESS</div>
        <div class="logo-subtitle">Adaptive ResNet arena</div>
      </div>
    </div>
    <div class="status-pill" id="backend-status">
      <div class="status-dot" id="backend-dot"></div>
      <span id="backend-text">Client Engine Ready</span>
    </div>
  </header>

  <main>
    <!-- Left: Chessboard Column -->
    <div class="board-container">
      <div class="player-banner" id="banner-black">
        <div class="player-info">
          <div class="player-avatar">B</div>
          <div>
            <div class="player-name">Black</div>
            <div class="captured-pieces" id="captured-by-white"></div>
          </div>
        </div>
        <div id="status-black" style="font-size:0.8rem; color:var(--text-muted)">Waiting</div>
      </div>

      <div class="board-wrapper">
        <canvas id="arrow-canvas" width="520" height="520"></canvas>
        <div class="chessboard" id="board"></div>

        <div class="modal-overlay" id="promotion-modal">
          <div class="promotion-dialog" id="promo-options"></div>
        </div>

        <div class="modal-overlay" id="result-modal">
          <div class="result-dialog">
            <div class="result-kicker">Game Over</div>
            <div class="result-title" id="result-title">Draw</div>
            <div class="result-sub" id="result-sub"></div>
            <button class="btn btn-primary btn-block" id="result-new-game">New Game</button>
          </div>
        </div>
      </div>

      <div class="player-banner" id="banner-white">
        <div class="player-info">
          <div class="player-avatar" style="background:#f8fafc; color:#0f172a">W</div>
          <div>
            <div class="player-name">White</div>
            <div class="captured-pieces" id="captured-by-black"></div>
          </div>
        </div>
        <div id="status-white" style="font-size:0.8rem; color:var(--accent); font-weight:700">Turn to move</div>
      </div>
    </div>

    <!-- Right: Predictions & Controls -->
    <div class="sidebar">

      <!-- Player Profiles Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <span class="card-title-icon">🧠</span>
            <span>Player Profiles</span>
          </div>
          <span id="learn-badge" style="font-size:0.72rem; color:var(--text-muted)">Adaptive</span>
        </div>
        <div style="display:flex; gap:8px;">
          <div style="flex:1">
            <div style="font-size:0.72rem; color:var(--text-muted); margin-bottom:4px">White</div>
            <input type="text" class="fen-input" id="white-player" list="profile-list" spellcheck="false" value="Guest White">
          </div>
          <div style="flex:1">
            <div style="font-size:0.72rem; color:var(--text-muted); margin-bottom:4px">Black</div>
            <input type="text" class="fen-input" id="black-player" list="profile-list" spellcheck="false" value="Guest Black">
          </div>
        </div>
        <datalist id="profile-list"></datalist>
        <div id="player-stats" style="margin-top:10px; font-size:0.75rem; color:var(--text-muted); line-height:1.5">
          Play a few moves to start learning this player's style.
        </div>
      </div>

      <!-- Prediction Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <span class="card-title-icon">⚡</span>
            <span>AI Move Predictions</span>
          </div>
          <span style="font-size:0.75rem; color:var(--text-muted)" id="pred-perspective">White's Turn</span>
        </div>

        <div class="prediction-list" id="prediction-container">
          <!-- Dynamically populated -->
        </div>

        <button class="btn btn-primary btn-block" id="btn-play-ai" style="margin-top:14px">
          🤖 Play Top Predicted Move
        </button>

        <div style="display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:6px; font-size:0.8rem; color:var(--text-muted); cursor:pointer;">
            <input type="checkbox" id="ai-auto"> AI auto-play
          </label>
          <select id="ai-side" style="background:#12110F; color:var(--text-main); border:1px solid var(--border-color); border-radius:8px; padding:6px 8px; font-size:0.8rem;">
            <option value="b">AI is Black</option>
            <option value="w">AI is White</option>
            <option value="both">AI plays both</option>
          </select>
          <span id="ai-status" style="font-size:0.72rem; color:var(--accent);"></span>
        </div>
      </div>

      <!-- Controls & History Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <span class="card-title-icon">📜</span>
            <span>Move History</span>
          </div>
          <span id="ply-count" style="font-size:0.8rem; color:var(--text-muted)">0 moves</span>
        </div>

        <div class="history-box" id="move-history">
          <!-- Moves list -->
        </div>

        <div style="margin-top: 14px; display: flex; flex-direction:column; gap:8px;">
          <div class="btn-row">
            <button class="btn" id="btn-undo">↩ Undo</button>
            <button class="btn" id="btn-flip">⇄ Flip</button>
            <button class="btn" id="btn-reset">↺ Reset</button>
          </div>

          <div class="fen-input-wrapper">
            <input type="text" class="fen-input" id="fen-field" spellcheck="false" placeholder="Paste FEN position...">
            <button class="btn" id="btn-load-fen">Load</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    // Runtime configuration injected by components/board.py when embedded in
    // Streamlit. When index.html is served by server.py these stay empty.
    const CHESS_CONFIG = window.CHESS_CONFIG || {};

        }

        if (move.promo) {
          san += '=' + move.promo.toUpperCase();
        }

        // Test check / checkmate
        const snap = this.makeMove(move, false);
        if (this.inCheck(this.turn)) {
          san += (this.getLegalMoves().length === 0) ? '#' : '+';
        }
        this.unmakeMove(snap);

        return san;
      }
    }

    // UI Controller
    const game = new ChessGame();
    let selectedSquare = null;
    let legalMovesForSelected = [];
    let flipped = false;
    let pendingPromoMove = null;
    let lastMove = null;

    // ---- Online per-player learning -------------------------------------
    const DEFAULT_WHITE = 'Guest White';
    const DEFAULT_BLACK = 'Guest Black';
    let serverAvailable = false;
    let resultReported = false;
    let gamePersisted = false;
    let gameId = newGameId();

    function newGameId() {
      return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function playerNameFor(color) {
      const el = document.getElementById(color === 'w' ? 'white-player' : 'black-player');
      const value = (el && el.value ? el.value : '').trim();
      return value || (color === 'w' ? DEFAULT_WHITE : DEFAULT_BLACK);
    }

    function currentPlayerName() {
      return playerNameFor(game.turn);
    }

    function saveProfiles() {
      try {
        localStorage.setItem('chessProfiles', JSON.stringify({
          white: playerNameFor('w'),
          black: playerNameFor('b')
        }));
      } catch (e) { /* storage disabled */ }
    }

    function loadProfiles() {
      try {
        const saved = JSON.parse(localStorage.getItem('chessProfiles') || 'null');
        if (saved) {
          document.getElementById('white-player').value = saved.white || DEFAULT_WHITE;
          document.getElementById('black-player').value = saved.black || DEFAULT_BLACK;
        }
      } catch (e) { /* ignore */ }
    }

    async function refreshProfileList() {
      try {
        const res = await fetch(`${API_BASE}/api/profiles`);
        if (!res.ok) return;
        const data = await res.json();
        const list = document.getElementById('profile-list');
        list.innerHTML = '';
        (data.profiles || []).forEach(profile => {
          const option = document.createElement('option');
          option.value = profile.name || profile.slug;
          option.label = `${profile.moves || 0} moves`;
          list.appendChild(option);
        });
      } catch (e) { /* server offline */ }
    }

    function renderPlayerStats(stats) {
      const box = document.getElementById('player-stats');
      if (!stats) {
        box.textContent = 'Start server.py to enable continuous learning.';
        return;
      }
      box.innerHTML =
        `<b style="color:var(--text-main)">${stats.name}</b> · ${stats.moves || 0} moves<br>` +
        `${stats.games || 0} games (${stats.wins || 0}W / ${stats.losses || 0}L / ${stats.draws || 0}D) · ` +
        `${stats.updates || 0} learning updates`;
    }

    async function postJson(url, payload) {
      const res = await fetch(API_BASE + url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    async function recordMove(fen, uci, color) {
      try {
        const data = await postJson('/api/move', {
          player: playerNameFor(color), fen, uci, gameId, color
        });
        if (data.player) renderPlayerStats(data.player);
      } catch (e) { /* server offline */ }
    }

    async function recordUndo(color) {
      try {
        const data = await postJson('/api/undo', {
          player: playerNameFor(color), gameId
        });
        if (data.player) renderPlayerStats(data.player);
      } catch (e) { /* server offline */ }
    }

    function detectGameResult() {
      if ((game.halfMoves || 0) >= 100) return 'draw';
      const legal = game.getLegalMoves();
      if (legal.length > 0) return null;
      if (game.inCheck(game.turn)) return game.turn === 'w' ? 'black' : 'white';
      return 'draw';
    }

    function showResultOverlay(winner) {
      const modal = document.getElementById('result-modal');
      const title = document.getElementById('result-title');
      const sub = document.getElementById('result-sub');
      if (!modal || !title || !sub) return;
      if (winner === 'draw') {
        title.textContent = 'Draw';
        sub.textContent = (game.halfMoves || 0) >= 100 ? 'Fifty-move rule' : 'Stalemate';
      } else {
        const color = winner === 'white' ? 'w' : 'b';
        title.textContent = playerNameFor(color) + ' won';
        sub.textContent = 'Checkmate · ' + (color === 'w' ? 'White' : 'Black');
      }
      modal.style.display = 'flex';
    }

    function moveListUci() {
      return game.history.map(snapshot => {
        const move = snapshot.move;
        return game.sqToAlgebraic(move.from) + game.sqToAlgebraic(move.to) + (move.promo || '');
      }).join(' ');
    }

    async function persistGame(winner) {
      const user = CHESS_CONFIG.user || null;
      const userColor = CHESS_CONFIG.userColor;
      const mode = CHESS_CONFIG.mode || 'ai';
      if (gamePersisted || !user || !user.id || !user.ticket || !userColor) return;
      if (mode !== 'ai' && mode !== 'online') return;

      const result = winner === 'draw'
        ? 'draw'
        : ((winner === 'white' ? 'w' : 'b') === userColor ? 'win' : 'loss');
      gamePersisted = true;
      try {
        await postJson('/api/game', {
          gameId,
          userId: user.id,
          username: user.name,
          ticket: user.ticket,
          result,
          moves: moveListUci(),
          fen: game.toFen(),
          mode,
          opponent: CHESS_CONFIG.opponentName || 'Neural AI',
          userColor
        });
      } catch (e) { /* server offline */ }
    }

    async function reportResultIfNeeded() {
      if (resultReported) return;
      const winner = detectGameResult();
      if (!winner) return;
      resultReported = true;
      showResultOverlay(winner);
      const outcomes = winner === 'draw'
        ? { w: 'draw', b: 'draw' }
        : { w: winner === 'white' ? 'win' : 'loss', b: winner === 'black' ? 'win' : 'loss' };
      for (const color of ['w', 'b']) {
        try {
          const data = await postJson('/api/result', {
            player: playerNameFor(color), gameId, outcome: outcomes[color], color
          });
          if (data.player) renderPlayerStats(data.player);
        } catch (e) { /* server offline */ }
      }
      await persistGame(winner);
      refreshProfileList();
    }

    function startNewGame() {
      gameId = newGameId();
      resultReported = false;
      gamePersisted = false;
      aiBudget = 400;
      const resultModal = document.getElementById('result-modal');
      if (resultModal) resultModal.style.display = 'none';
    }

    // ---- AI auto-play ----------------------------------------------------
    let aiAuto = false;
    let aiSide = 'b';
    let aiLevel = 'top';
    let aiThinking = false;
    let aiTimer = null;
    let aiBudget = 400;

    function saveAiPrefs() {
      try {
        localStorage.setItem('chessAiPrefs', JSON.stringify({
          auto: aiAuto, side: aiSide, level: aiLevel
        }));
      } catch (e) { /* storage disabled */ }
    }

    function loadAiPrefs() {
      try {
        const saved = JSON.parse(localStorage.getItem('chessAiPrefs') || 'null');
        if (saved) {
          aiAuto = !!saved.auto;
          aiSide = (saved.side === 'w' || saved.side === 'both') ? saved.side : 'b';
          aiLevel = (saved.level === 'mixed' || saved.level === 'random') ? saved.level : 'top';
        }
      } catch (e) { /* ignore */ }
      const checkbox = document.getElementById('ai-auto');
      const select = document.getElementById('ai-side');
      if (checkbox) checkbox.checked = aiAuto;
      if (select) select.value = aiSide;
    }

    function applyConfig() {
      if (!CHESS_CONFIG || !Object.keys(CHESS_CONFIG).length) return;

      const whiteInput = document.getElementById('white-player');
      const blackInput = document.getElementById('black-player');
      if (CHESS_CONFIG.whiteName && whiteInput) whiteInput.value = CHESS_CONFIG.whiteName;
      if (CHESS_CONFIG.blackName && blackInput) blackInput.value = CHESS_CONFIG.blackName;

      if (typeof CHESS_CONFIG.aiAuto === 'boolean') aiAuto = CHESS_CONFIG.aiAuto;
      if (['w', 'b', 'both'].includes(CHESS_CONFIG.aiSide)) aiSide = CHESS_CONFIG.aiSide;
      if (['top', 'mixed', 'random'].includes(CHESS_CONFIG.aiLevel)) aiLevel = CHESS_CONFIG.aiLevel;

      const checkbox = document.getElementById('ai-auto');
      const select = document.getElementById('ai-side');
      if (checkbox) checkbox.checked = aiAuto;
      if (select) select.value = aiSide;

      const mode = CHESS_CONFIG.mode || 'ai';
      if (mode === 'local' || mode === 'puzzle') {
        const controls = document.getElementById('ai-auto')?.parentElement;
        if (controls) controls.style.display = 'none';
      }

      if (CHESS_CONFIG.startFen) {
        try {
          game.loadFen(CHESS_CONFIG.startFen);
          game.history = [];
          lastMove = null;
          startNewGame();
        } catch (e) { /* keep the default position */ }
      }
    }

    function chooseAiPrediction(predictions) {
      if (!predictions || predictions.length === 0) return null;
      if (aiLevel === 'random') {
        return predictions[Math.floor(Math.random() * predictions.length)];
      }
      if (aiLevel === 'mixed') {
        const pool = predictions.slice(0, Math.min(3, predictions.length));
        return pool[Math.floor(Math.random() * pool.length)];
      }
      return predictions[0];
    }

    function aiIsTurn() {
      if (!aiAuto || resultReported) return false;
      return aiSide === 'both' || game.turn === aiSide;
    }

    function setAiStatus(text) {
      const el = document.getElementById('ai-status');
      if (el) el.textContent = text || '';
    }

    function scheduleAiMove() {
      if (!aiIsTurn()) {
        setAiStatus('');
        return;
      }
      if (aiBudget <= 0) {
        aiAuto = false;
        document.getElementById('ai-auto').checked = false;
        saveAiPrefs();
        setAiStatus('Auto-play limit reached');
        return;
      }
      setAiStatus('AI thinking...');
      clearTimeout(aiTimer);
      aiTimer = setTimeout(runAiMove, 550);
    }

    async function runAiMove() {
      if (aiThinking || !aiIsTurn()) return;
      aiThinking = true;
      const fenBefore = game.toFen();
      try {
        const predictions = await calculatePredictions();
        const choice = chooseAiPrediction(predictions);
        if (!choice) return;
        if (game.toFen() !== fenBefore || !aiIsTurn()) return;
        aiBudget -= 1;
        setAiStatus('AI plays ' + choice.san);
        executeMove(choice.move);
      } catch (e) {
        setAiStatus('AI move failed');
      } finally {
        aiThinking = false;
      }
    }

    const boardEl = document.getElementById('board');
    const arrowCanvas = document.getElementById('arrow-canvas');
    const ctx = arrowCanvas.getContext('2d');

    function renderBoard() {
      boardEl.innerHTML = '';
      const legalMoves = game.getLegalMoves();
      const inCheck = game.inCheck(game.turn);
      const kingChar = game.turn === 'w' ? 'K' : 'k';

      for (let i = 0; i < 64; i++) {
        const sq = flipped ? 63 - i : i;
        const r = Math.floor(sq / 8);
        const f = sq % 8;
        const isLight = (r + f) % 2 === 0;

        const sqDiv = document.createElement('div');
        sqDiv.className = `square ${isLight ? 'light' : 'dark'}`;
        sqDiv.dataset.sq = sq;

        if (selectedSquare === sq) sqDiv.classList.add('selected');
        if (lastMove && (lastMove.from === sq || lastMove.to === sq)) sqDiv.classList.add('last-move');

        const piece = game.board[sq];
        if (inCheck && piece === kingChar) sqDiv.classList.add('check');

        // Legal indicators
        if (selectedSquare !== null) {
          const matchMove = legalMovesForSelected.find(m => m.to === sq);
          if (matchMove) {
            if (piece || matchMove.isEP) {
              sqDiv.classList.add('legal-capture');
            } else {
              sqDiv.classList.add('legal-target');
            }
          }
        }

        // Coordinate labels
        if ((!flipped && f === 0) || (flipped && f === 7)) {
          const rankLabel = document.createElement('span');
          rankLabel.className = 'coord-rank';
          rankLabel.textContent = 8 - r;
          sqDiv.appendChild(rankLabel);
        }
        if ((!flipped && r === 7) || (flipped && r === 0)) {
          const fileLabel = document.createElement('span');
          fileLabel.className = 'coord-file';
          fileLabel.textContent = String.fromCharCode(97 + f);
          sqDiv.appendChild(fileLabel);
        }

        // Piece
        if (piece) {
          const pieceDiv = document.createElement('div');
          pieceDiv.className = 'piece';
          pieceDiv.innerHTML = PIECE_SVGS[piece] || '';
          pieceDiv.draggable = true;

          pieceDiv.addEventListener('dragstart', (e) => {
            selectSquare(sq);
            e.dataTransfer.setData('text/plain', sq);
          });

          sqDiv.appendChild(pieceDiv);
        }

        sqDiv.addEventListener('dragover', (e) => e.preventDefault());
        sqDiv.addEventListener('drop', (e) => {
          e.preventDefault();
          const fromSq = parseInt(e.dataTransfer.getData('text/plain'), 10);
          attemptMove(fromSq, sq);
        });

        sqDiv.addEventListener('click', () => {
          if (selectedSquare === null) {
            if (piece && (game.isWhite(piece) ? 'w' : 'b') === game.turn) {
              selectSquare(sq);
            }
          } else {
            if (selectedSquare === sq) {
              clearSelection();
            } else if (piece && (game.isWhite(piece) ? 'w' : 'b') === game.turn) {
              selectSquare(sq);
            } else {
              attemptMove(selectedSquare, sq);
            }
          }
        });

        boardEl.appendChild(sqDiv);
      }

      updateStatusUI();
      updateMoveHistoryUI();
      calculatePredictions().then(() => scheduleAiMove());
    }

    function selectSquare(sq) {
      selectedSquare = sq;
      const allMoves = game.getLegalMoves();
      legalMovesForSelected = allMoves.filter(m => m.from === sq);
      renderBoardFastHighlight();
    }

    function clearSelection() {
      selectedSquare = null;
      legalMovesForSelected = [];
      renderBoardFastHighlight();
    }

    function renderBoardFastHighlight() {
      // Light re-render of selection classes without rebuilding full DOM
      document.querySelectorAll('.square').forEach(sqDiv => {
        const sq = parseInt(sqDiv.dataset.sq, 10);
        sqDiv.classList.remove('selected', 'legal-target', 'legal-capture');
        if (selectedSquare === sq) sqDiv.classList.add('selected');
        if (selectedSquare !== null) {
          const matchMove = legalMovesForSelected.find(m => m.to === sq);
          if (matchMove) {
            const piece = game.board[sq];
            if (piece || matchMove.isEP) {
              sqDiv.classList.add('legal-capture');
            } else {
              sqDiv.classList.add('legal-target');
            }
          }
        }
      });
    }

    function attemptMove(fromSq, toSq) {
      const candidates = game.getLegalMoves().filter(m => m.from === fromSq && m.to === toSq);
      if (candidates.length === 0) {
        clearSelection();
        return;
      }

      // Check promotion
      if (candidates.some(m => m.promo)) {
        pendingPromoMove = { from: fromSq, to: toSq };
        showPromotionDialog();
        return;
      }

      executeMove(candidates[0]);
    }

    function executeMove(move) {
      const isCapture = !!game.board[move.to] || move.isEP;
      const fenBefore = game.toFen();
      const moveColor = game.turn;
      const uci = game.sqToAlgebraic(move.from) + game.sqToAlgebraic(move.to) +
                  (move.promo || '');
      move.san = game.moveToSan(move);
      lastMove = move;
      game.makeMove(move, true);

      if (isCapture) {
        sounds.playCapture();
      } else {
        sounds.playMove();
      }

      clearSelection();
      recordMove(fenBefore, uci, moveColor);
      renderBoard();
      reportResultIfNeeded();
    }

    function showPromotionDialog() {
      const modal = document.getElementById('promotion-modal');
      const options = document.getElementById('promo-options');
      options.innerHTML = '';
      const color = game.turn;
      const choices = color === 'w' ? ['Q', 'R', 'B', 'N'] : ['q', 'r', 'b', 'n'];

      choices.forEach(ch => {
        const btn = document.createElement('div');
        btn.className = 'promo-choice';
        btn.innerHTML = PIECE_SVGS[ch];
        btn.onclick = () => {
          modal.style.display = 'none';
          executeMove({ from: pendingPromoMove.from, to: pendingPromoMove.to, promo: ch.toLowerCase() });
          pendingPromoMove = null;
        };
        options.appendChild(btn);
      });

      modal.style.display = 'flex';
    }

    function updatePlayerBanners() {
      const whiteName = document.querySelector('#banner-white .player-name');
      const blackName = document.querySelector('#banner-black .player-name');
      if (whiteName) whiteName.textContent = playerNameFor('w');
      if (blackName) blackName.textContent = playerNameFor('b');
    }

    function updateStatusUI() {
      const turnW = game.turn === 'w';
      const inCheck = game.inCheck(game.turn);
      const legalCount = game.getLegalMoves().length;
      updatePlayerBanners();

      let statusMsg = turnW ? "White's turn" : "Black's turn";
      if (legalCount === 0) {
        statusMsg = inCheck ? `Checkmate! ${turnW ? 'Black' : 'White'} wins!` : "Stalemate! Draw.";
      } else if (inCheck) {
        statusMsg += " (Check!)";
      }

      document.getElementById('status-white').textContent = turnW ? statusMsg : "Waiting";
      document.getElementById('status-white').style.color = turnW ? "var(--accent)" : "var(--text-muted)";
      document.getElementById('status-black').textContent = !turnW ? statusMsg : "Waiting";
      document.getElementById('status-black').style.color = !turnW ? "var(--accent)" : "var(--text-muted)";
      document.getElementById('pred-perspective').textContent = `${turnW ? 'White' : 'Black'}'s Perspective`;
      document.getElementById('fen-field').value = game.toFen();
    }

    function updateMoveHistoryUI() {
      const histBox = document.getElementById('move-history');
      histBox.innerHTML = '';
      const totalPlies = game.history.length;
      document.getElementById('ply-count').textContent = `${Math.ceil(totalPlies / 2)} moves`;

      for (let i = 0; i < totalPlies; i += 2) {
        const numDiv = document.createElement('div');
        numDiv.className = 'history-num';
        numDiv.textContent = `${Math.floor(i / 2) + 1}.`;

        const wMoveDiv = document.createElement('div');
        wMoveDiv.className = 'history-move';
        wMoveDiv.textContent = game.history[i].san || game.history[i].move.san || game.sqToAlgebraic(game.history[i].move.from) + game.sqToAlgebraic(game.history[i].move.to);

        histBox.appendChild(numDiv);
        histBox.appendChild(wMoveDiv);

        if (i + 1 < totalPlies) {
          const bMoveDiv = document.createElement('div');
          bMoveDiv.className = 'history-move';
          bMoveDiv.textContent = game.history[i + 1].san || game.history[i + 1].move.san || game.sqToAlgebraic(game.history[i + 1].move.from) + game.sqToAlgebraic(game.history[i + 1].move.to);
          histBox.appendChild(bMoveDiv);
        } else {
          histBox.appendChild(document.createElement('div'));
        }
      }
      histBox.scrollTop = histBox.scrollHeight;
    }

    // Move Prediction Engine (Communicates with local server if active, or offline heuristic model)
    async function calculatePredictions() {
      const fen = game.toFen();
      const legalMoves = game.getLegalMoves();
      const container = document.getElementById('prediction-container');

      if (legalMoves.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted); padding:12px; text-align:center">No legal moves available.</div>';
        clearArrows();
        return [];
      }

      // Try fetching from server.py (adaptive per-player model)
      try {
        const res = await fetch(`${API_BASE}/api/predict`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fen: fen, player: currentPlayerName() })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.player) renderPlayerStats(data.player);
          serverAvailable = !!data.model_loaded;
          document.getElementById('learn-badge').textContent =
            data.adaptive ? 'Online learning ON' : 'Base model';
          document.getElementById('learn-badge').style.color =
            data.adaptive ? 'var(--success)' : 'var(--text-muted)';
          if (data && data.moves && data.moves.length > 0) {
            renderPredictionList(data.moves);
            document.getElementById('backend-dot').style.background = 'var(--success)';
            document.getElementById('backend-text').textContent =
              data.adaptive ? 'Adaptive Model Learning' :
              (data.model_loaded ? 'Neural Model Active' : 'Server Connected');
            return data.moves;
          }
        }
      } catch (err) {
        serverAvailable = false;
        // Fallback to offline positional scoring heuristic
      }

      // Standalone Heuristic Predictor (matches opening & midgame master weights)
      document.getElementById('backend-dot').style.background = '#eab308';
      document.getElementById('backend-text').textContent = 'Offline Engine Active';

      const scoredMoves = legalMoves.map(m => {
        const san = game.moveToSan(m);
        const p = game.board[m.from];
        const cap = game.board[m.to];
        let score = Math.random() * 0.15; // Natural variance

        // Heuristics: Center control, captures, development
        const toF = m.to % 8;
        const toR = Math.floor(m.to / 8);
        if ([27, 28, 35, 36].includes(m.to)) score += 0.45; // Sweet center
        if (cap) score += 0.65;
        if (m.isCastle) score += 0.70;
        if (p.toUpperCase() === 'N' || p.toUpperCase() === 'B') score += 0.35;
        if (san.includes('+')) score += 0.50;

        return { move: m, san, score };
      });

      // Softmax conversion
      scoredMoves.sort((a, b) => b.score - a.score);
      const top = scoredMoves.slice(0, 5);
      const expSum = top.reduce((acc, cur) => acc + Math.exp(cur.score * 2.5), 0);
      const formatted = top.map(item => ({
        move: item.move,
        san: item.san,
        prob: Math.exp(item.score * 2.5) / expSum
      }));

      renderPredictionList(formatted);
      return formatted;
    }

    function renderPredictionList(predList) {
      const container = document.getElementById('prediction-container');
      container.innerHTML = '';

      clearArrows();
      if (predList.length > 0) {
        drawPredictionArrow(predList[0].move, 'rgba(216, 180, 90, 0.85)');
        if (predList.length > 1) drawPredictionArrow(predList[1].move, 'rgba(143, 191, 106, 0.45)');
      }

      predList.forEach((item, index) => {
        const percent = Math.round(item.prob * 1000) / 10;
        const div = document.createElement('div');
        div.className = `prediction-item ${index === 0 ? 'top-pick' : ''}`;
        div.innerHTML = `
          <div class="pred-row">
            <div class="pred-move">
              <span class="pred-rank">${index + 1}</span>
              <span>${item.san}</span>
            </div>
            <span class="pred-prob">${percent.toFixed(1)}%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${percent}%;"></div>
          </div>
        `;

        div.addEventListener('click', () => {
          executeMove(item.move);
        });

        container.appendChild(div);
      });
    }

    // Dynamic Visual Arrow on Canvas
    function clearArrows() {
      ctx.clearRect(0, 0, arrowCanvas.width, arrowCanvas.height);
    }

    function drawPredictionArrow(move, color) {
      if (!move) return;
      const sqSize = arrowCanvas.width / 8;
      const getCenter = (sq) => {
        const actualSq = flipped ? 63 - sq : sq;
        const f = actualSq % 8;
        const r = Math.floor(actualSq / 8);
        return { x: f * sqSize + sqSize / 2, y: r * sqSize + sqSize / 2 };
      };

      const from = getCenter(move.from);
      const to = getCenter(move.to);

      const angle = Math.atan2(to.y - from.y, to.x - from.x);
      const headlen = 16;
      const shortenedTo = {
        x: to.x - Math.cos(angle) * (sqSize * 0.22),
        y: to.y - Math.sin(angle) * (sqSize * 0.22)
      };

      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';

      // Line
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(shortenedTo.x, shortenedTo.y);
      ctx.stroke();

      // Arrow head
      ctx.beginPath();
      ctx.moveTo(shortenedTo.x, shortenedTo.y);
      ctx.lineTo(shortenedTo.x - headlen * Math.cos(angle - Math.PI / 6), shortenedTo.y - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(shortenedTo.x - headlen * Math.cos(angle + Math.PI / 6), shortenedTo.y - headlen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    // Event Listeners
    document.getElementById('btn-play-ai').addEventListener('click', () => {
      const firstPred = document.querySelector('.prediction-item');
      if (firstPred) firstPred.click();
    });

    document.getElementById('ai-auto').addEventListener('change', (e) => {
      aiAuto = e.target.checked;
      aiBudget = 400;
      saveAiPrefs();
      if (aiAuto) {
        scheduleAiMove();
      } else {
        clearTimeout(aiTimer);
        setAiStatus('');
      }
    });

    document.getElementById('ai-side').addEventListener('change', (e) => {
      aiSide = e.target.value;
      aiBudget = 400;
      saveAiPrefs();
      clearTimeout(aiTimer);
      scheduleAiMove();
    });

    document.getElementById('btn-undo').addEventListener('click', () => {
      if (game.history.length > 0) {
        const lastSnap = game.history.pop();
        game.unmakeMove(lastSnap);
        lastMove = game.history.length > 0 ? game.history[game.history.length - 1].move : null;
        clearSelection();
        recordUndo(lastSnap.prevTurn);
        renderBoard();
      }
    });

    document.getElementById('btn-flip').addEventListener('click', () => {
      flipped = !flipped;
      renderBoard();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      game.loadFen(CHESS_CONFIG.startFen || 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');
      game.history = [];
      lastMove = null;
      startNewGame();
      clearSelection();
      renderBoard();
    });

    document.getElementById('result-new-game').addEventListener('click', () => {
      document.getElementById('btn-reset').click();
    });

    document.getElementById('btn-load-fen').addEventListener('click', () => {
      const fen = document.getElementById('fen-field').value.trim();
      if (fen) {
        try {
          game.loadFen(fen);
          game.history = [];
          lastMove = null;
          startNewGame();
          clearSelection();
          renderBoard();
        } catch (e) {
          alert('Invalid FEN string');
        }
      }
    });

    ['white-player', 'black-player'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('change', () => {
        saveProfiles();
        updatePlayerBanners();
        calculatePredictions();
      });
    });

    // Initial render
    loadProfiles();
    loadAiPrefs();
    applyConfig();
    refreshProfileList();
    renderBoard();
  </script>
</body>
</html>
